name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Ensure Keystore for Release
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Meu Financeiro, OU=App, O=Meu Financeiro, L=SP, ST=SP, C=BR"
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: ./gradlew :app:assembleRelease

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuFinanceiro-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuFinanceiro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
